<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CHATILLO AMIGO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #6366f1; --bg: #0b0f1a; --panel: #161b2c; }
        body { background: var(--bg); color: #f8fafc; font-family: 'Inter', sans-serif; height: 100dvh; overflow: hidden; display: flex; margin: 0; }
        .glass { background: rgba(22, 27, 44, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.05); }
        .sidebar-left { width: 72px; background: #080a12; border-right: 1px solid #1e293b; display: flex; flex-direction: column; align-items: center; padding: 20px 0; flex-shrink: 0; z-index: 60; }
        .sidebar-main { width: 300px; background: var(--panel); border-right: 1px solid #1e293b; flex-shrink: 0; z-index: 50; }
        #master-panel { position: fixed; right: -500px; top: 0; bottom: 0; width: 450px; z-index: 1000; transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); background: #0f172a; border-left: 1px solid #334155; box-shadow: -10px 0 30px rgba(0,0,0,0.5); display: flex; flex-direction: column; }
        #master-panel.open { right: 0; }
        .modal { position: fixed; inset: 0; z-index: 9999; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,0.8); backdrop-filter: blur(4px); }
        .modal.active { display: flex; }
        #auth-overlay { position: fixed; inset: 0; z-index: 10000; background: #0b0f1a; display: flex; align-items: center; justify-content: center; }
        .btn-primary { background: var(--accent); color: white; transition: all 0.2s; font-weight: 600; }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        #global-announcement { background: linear-gradient(90deg, #4f46e5, #9333ea); display: none; position: relative; z-index: 40; }
    </style>
</head>
<body>

    <div id="auth-overlay">
        <div class="max-w-md w-full p-8 text-center">
            <h1 class="text-3xl font-extrabold mb-8"><img src="/chatillo.png" alt="chatillo-amigo"></h1>
            <button id="google-login" class="w-full bg-white text-slate-900 py-4 rounded-xl font-bold flex items-center justify-center gap-3 shadow-2xl hover:bg-slate-100 transition-all">
                <img src="https://cdn-icons-png.flaticon.com/512/2991/2991148.png" class="w-5"> INICIAR SESIÓN
            </button>
        </div>
    </div>

    <aside class="sidebar-left gap-4">
        <div class="w-12 h-12 bg-indigo-600 rounded-2xl flex items-center justify-center cursor-pointer hover:rounded-xl transition-all" onclick="window.goHome()">
            <i class="fa-solid fa-house"></i>
        </div>
        <div class="w-8 h-px bg-slate-800"></div>
        <div id="aside-groups" class="flex flex-col gap-3"></div>
        <button onclick="window.openModal('m-group')" class="w-12 h-12 rounded-full bg-slate-800 text-emerald-400 hover:bg-emerald-500 hover:text-white transition-all"><i class="fas fa-plus"></i></button>
        <button id="btn-master-toggle" class="hidden w-12 h-12 mt-auto rounded-2xl bg-amber-500/10 text-amber-500 border border-amber-500/20 hover:bg-amber-500 hover:text-white transition-all"><i class="fas fa-user-shield"></i></button>
    </aside>

    <aside class="sidebar-main flex flex-col">
        <div class="p-6 h-16 flex items-center justify-between border-b border-slate-800">
            <h2 class="text-xs font-bold uppercase text-slate-500 tracking-widest">Mensajes</h2>
            <button onclick="window.openModal('m-dm')" class="text-slate-500 hover:text-indigo-400"><i class="fas fa-edit"></i></button>
        </div>
        <div id="aside-dms" class="flex-1 overflow-y-auto p-4 space-y-1"></div>
        <div onclick="window.openUserProfile()" class="p-4 bg-slate-900/50 border-t border-slate-800 flex items-center gap-3 cursor-pointer hover:bg-slate-800 transition-all">
            <img id="u-pfp" class="w-10 h-10 rounded-full border border-slate-700">
            <div class="flex-1 min-w-0">
                <p id="u-name" class="text-sm font-bold truncate"></p>
                <div class="flex items-center gap-1">
                    <span id="u-status-dot" class="w-2 h-2 rounded-full bg-emerald-500 transition-all duration-300"></span>
                    <span id="u-status-text" class="text-[10px] text-slate-400">Disponible</span>
                </div>
            </div>
        </div>
    </aside>

    <main class="flex-1 flex flex-col relative bg-[#0f1422]">
        <div id="global-announcement" class="px-6 py-2 text-center text-xs font-bold text-white shadow-lg">
            <span id="announcement-text"></span>
        </div>

        <div id="home-screen" class="absolute inset-0 z-[100] bg-[#0b0f1a] flex flex-col items-center justify-center text-center p-10">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 w-full max-w-lg">
                <button onclick="window.openModal('m-group')" class="p-8 bg-slate-800 rounded-3xl font-bold hover:scale-105 transition-all border border-slate-700">                    
                    <img src="https://cdn-icons-png.freepik.com/512/13102/13102467.png" class="w-12 h-12 mx-auto mb-3">
                    <span class="block font-bold">Crear Grupo</span>
                </button>
                <button onclick="window.openModal('m-dm')" class="p-8 border border-slate-800 rounded-3xl font-bold hover:scale-105 transition-all bg-slate-900/50">
                    <img src="https://cdn-icons-png.freepik.com/512/6437/6437413.png" class="w-12 h-12 mx-auto mb-3">
                    <span class="block font-bold">Chat Privado</span>
                </button>
            </div>
        </div>

        <header class="h-16 px-6 flex items-center justify-between glass border-b border-slate-800 z-50">
            <div class="flex items-center gap-4">
                <div id="h-icon" class="w-9 h-9 rounded-xl overflow-hidden bg-slate-800"></div>
                <h3 id="h-name" class="font-bold text-sm">Selecciona un chat</h3>
            </div>
            <button id="btn-manage-group" onclick="window.openGroupSettings()" class="hidden px-4 py-2 bg-indigo-600/20 text-indigo-400 rounded-lg text-xs font-bold hover:bg-indigo-600 hover:text-white transition-all">GESTIÓN</button>
        </header>

        <div id="flow" class="flex-1 overflow-y-auto p-6 space-y-4"></div>
        
        <div class="p-4 md:px-10 pb-10">
            <div id="mute-notice" class="hidden p-3 text-center bg-red-500/10 text-red-500 text-[10px] font-bold rounded-xl mb-2 border border-red-500/20 uppercase">
                <i class="fas fa-lock mr-2"></i> Estás silenciado por el administrador
            </div>
            <div class="flex gap-3 max-w-5xl mx-auto bg-slate-800/50 p-2 rounded-2xl border border-slate-700 items-center">
                <button onclick="alert('Función de archivos lista para conectar con Storage')" class="p-3 text-slate-400 hover:text-white transition-all"><i class="fas fa-paperclip"></i></button>
                <input type="text" id="m-input" placeholder="Escribe un mensaje..." class="flex-1 bg-transparent px-2 py-3 outline-none text-sm text-white">
                <button onclick="window.send()" class="w-12 h-12 btn-primary rounded-xl flex items-center justify-center shadow-lg active:scale-95"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
    </main>

    <div id="m-manage-group" class="modal" onclick="if(event.target===this)window.closeModal('m-manage-group')">
        <div class="glass p-8 rounded-3xl w-full max-w-md border border-slate-700">
            <h2 class="text-xl font-bold mb-6">Ajustes del Grupo</h2>
            <div class="space-y-4 mb-6">
                <input type="text" id="edit-g-name" class="w-full bg-slate-900 p-3 rounded-xl border border-slate-700 text-sm" placeholder="Nombre del grupo">
                <button onclick="window.updateGroupName()" class="w-full py-2 bg-indigo-600 rounded-xl text-xs font-bold">GUARDAR NOMBRE</button>
                <div class="h-px bg-slate-800"></div>
                <div class="flex gap-2">
                    <input type="email" id="add-m-email" class="flex-1 bg-slate-900 p-3 rounded-xl border border-slate-700 text-sm" placeholder="Añadir por email">
                    <button onclick="window.addMember()" class="bg-emerald-600 px-4 rounded-xl"><i class="fas fa-user-plus"></i></button>
                </div>
            </div>
            <div id="group-members-list" class="space-y-2 max-h-40 overflow-y-auto mb-6"></div>
            <button onclick="window.closeModal('m-manage-group')" class="w-full py-3 bg-slate-800 rounded-xl font-bold text-xs">CERRAR</button>
        </div>
    </div>

    <aside id="master-panel">
        <div class="p-6 border-b border-slate-800 flex justify-between items-center bg-indigo-900/20">
            <div><h2 class="font-black text-amber-500">ADMIN MODE</h2><p class="text-[10px] text-slate-400">Control total</p></div>
            <button onclick="document.getElementById('master-panel').classList.remove('open')"><i class="fas fa-times"></i></button>
        </div>
        <div class="p-6 flex-1 overflow-y-auto space-y-8">
            <div class="space-y-3">
                <h3 class="text-[10px] font-bold text-slate-500 uppercase tracking-tighter">Anuncio Global</h3>
                <textarea id="in-global-msg" class="w-full bg-slate-900 p-4 rounded-xl text-xs border border-slate-700 outline-none" placeholder="Escribe aquí..."></textarea>
                <div class="flex gap-2">
                    <button onclick="window.setAnnouncement()" class="flex-1 py-3 bg-indigo-600 text-white font-bold text-xs rounded-xl">PUBLICAR</button>
                    <button onclick="window.clearAnnouncement()" class="px-4 py-3 bg-slate-800 text-red-500 rounded-xl"><i class="fas fa-trash"></i></button>
                </div>
            </div>
            <div class="space-y-4"><h3 class="text-[10px] font-bold text-slate-500 uppercase">Usuarios</h3><div id="admin-user-list" class="space-y-3"></div></div>
        </div>
    </aside>

    <div id="m-group" class="modal" onclick="if(event.target===this)window.closeModal('m-group')">
        <div class="glass p-8 rounded-3xl w-full max-w-sm border border-slate-700">
            <h2 class="text-xl font-bold mb-4">Nuevo Grupo</h2>
            <input type="text" id="in-g-name" class="w-full bg-slate-900 p-4 rounded-xl mb-4 outline-none border border-slate-700" placeholder="Nombre del grupo">
            <button onclick="window.createGroup()" class="w-full py-4 btn-primary rounded-xl font-bold">CREAR AHORA</button>
        </div>
    </div>

    <div id="m-dm" class="modal" onclick="if(event.target===this)window.closeModal('m-dm')">
        <div class="glass p-8 rounded-3xl w-full max-w-sm border border-slate-700">
            <h2 class="text-xl font-bold mb-4">Chat Privado</h2>
            <input type="email" id="in-d-email" class="w-full bg-slate-900 p-4 rounded-xl mb-4 outline-none border border-slate-700" placeholder="Correo del usuario">
            <button onclick="window.addFriend()" class="w-full py-4 btn-primary rounded-xl font-bold">EMPEZAR CHAT</button>
        </div>
    </div>

    <div id="m-user-settings" class="modal" onclick="if(event.target===this)window.closeModal('m-user-settings')">
        <div class="glass p-8 rounded-3xl w-full max-w-sm border border-slate-700 text-center">
            <img id="u-pfp-large" class="w-24 h-24 rounded-full mx-auto mb-4 border-4 border-indigo-600/30">
            <h2 id="u-name-large" class="text-xl font-bold mb-6 text-white"></h2>
            <select id="status-select" onchange="window.updateStatus(this.value)" class="w-full bg-slate-900 p-4 rounded-xl mb-8 text-white border border-slate-700 outline-none">
                <option value="Disponible">🟢 Disponible</option>
                <option value="Ocupado">🔴 Ocupado</option>
                <option value="Ausente">🟡 Ausente</option>
                <option value="Invisible">⚪ Invisible</option>
            </select>
            <button onclick="window.auth.signOut().then(()=>location.reload())" class="w-full py-3 bg-red-500/10 text-red-500 rounded-xl font-bold border border-red-500/20">CERRAR SESIÓN</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp, doc, getDoc, setDoc, deleteDoc, updateDoc, where, getDocs, arrayUnion, arrayRemove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const MASTER_EMAIL = "ikerdelmon@gmail.com"; 
        const firebaseConfig = { apiKey: "AIzaSyAxkmpPmxmABq4XnSD-PqbON4stEO6W2vk", authDomain: "chatillo-amigo.firebaseapp.com", projectId: "chatillo-amigo", appId: "1:120658187031:web:26accfd6ca7c9bb8649d52" };
        
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();
        window.auth = auth;

        let user = {}, activeRoom = '', isAdmin = false, currentRoom = null, unsubMsgs = null;

        document.getElementById('google-login').onclick = () => signInWithPopup(auth, provider);

        onAuthStateChanged(auth, async (u) => {
            if (u) {
                const email = u.email.toLowerCase();
                isAdmin = (email === MASTER_EMAIL);
                const userRef = doc(db, "users", u.uid);
                const snap = await getDoc(userRef);
                const data = snap.exists() ? snap.data() : { status: 'Disponible' };
                
                if (data.ban && data.ban > Date.now()) {
                    alert("Cuenta suspendida"); auth.signOut(); return;
                }

                user = { uid: u.uid, name: u.displayName, pfp: u.photoURL, email, status: data.status };
                document.getElementById('auth-overlay').style.display = 'none';
                document.getElementById('u-name').innerText = user.name;
                document.getElementById('u-pfp').src = user.pfp;
                window.updateStatusUI(user.status);

                if(isAdmin) {
                    document.getElementById('btn-master-toggle').classList.remove('hidden');
                    document.getElementById('btn-master-toggle').onclick = () => document.getElementById('master-panel').classList.toggle('open');
                    initAdminPanel();
                }

                await setDoc(userRef, { name: user.name, email, pfp: user.pfp }, { merge: true });
                loadRooms(); listenAnnouncements();
            }
        });

        function loadRooms() {
            onSnapshot(collection(db, "salas"), (snap) => {
                const gB = document.getElementById('aside-groups');
                const dB = document.getElementById('aside-dms');
                gB.innerHTML = ""; dB.innerHTML = "";
                snap.forEach(s => {
                    const d = s.data();
                    if (isAdmin || d.members?.includes(user.email)) {
                        if (d.type === 'group') {
                            gB.innerHTML += `<img src="${d.icon}" class="w-12 h-12 rounded-2xl cursor-pointer border-2 transition-all ${activeRoom === s.id ? 'border-indigo-500 scale-110 shadow-lg' : 'border-transparent opacity-70 hover:opacity-100'}" onclick="window.join('${s.id}')">`;
                        } else {
                            const other = d.members.find(m => m !== user.email) || "Tú";
                            dB.innerHTML += `<div onclick="window.join('${s.id}')" class="p-3 rounded-xl cursor-pointer hover:bg-indigo-500/10 transition-all ${activeRoom === s.id ? 'bg-indigo-500/20 text-indigo-400' : ''}"><p class="text-xs font-semibold truncate">${other}</p></div>`;
                        }
                    }
                });
            });
        }

        window.join = async (id) => {
            if(unsubMsgs) unsubMsgs();
            activeRoom = id;
            document.getElementById('home-screen').classList.add('hidden');
            
            onSnapshot(doc(db, "salas", id), (snap) => {
                currentRoom = snap.data();
                if(!currentRoom) return;
                document.getElementById('h-name').innerText = currentRoom.name || "Chat Privado";
                document.getElementById('h-icon').innerHTML = `<img src="${currentRoom.icon || 'https://ui-avatars.com/api/?name=Chat'}" class="w-full h-full object-cover">`;
                
                // GESTIÓN: Visible si eres ADMIN o DUEÑO
                const canManage = isAdmin || currentRoom.owner === user.email;
                document.getElementById('btn-manage-group').classList.toggle('hidden', !canManage || currentRoom.type !== 'group');
            });

            unsubMsgs = onSnapshot(query(collection(db, "salas", id, "mensajes"), orderBy("time", "asc")), (snap) => {
                const flow = document.getElementById('flow'); flow.innerHTML = "";
                snap.forEach(ds => {
                    const m = ds.data(); const isMe = m.uid === user.uid;
                    flow.innerHTML += `<div class="flex gap-3 ${isMe ? 'flex-row-reverse' : ''} animate-in fade-in">
                        <img src="${m.pfp}" class="w-8 h-8 rounded-full border border-slate-700 self-end">
                        <div class="max-w-[70%]">
                            <p class="text-[9px] text-slate-500 mb-1 ${isMe ? 'text-right' : ''}">${m.user}</p>
                            <div class="px-4 py-2 rounded-2xl text-sm ${isMe ? 'bg-indigo-600 text-white rounded-br-none' : 'bg-slate-800 text-slate-200 rounded-bl-none shadow-md'}">${m.text}</div>
                        </div>
                        ${isAdmin ? `<button onclick="window.deleteMsg('${ds.id}')" class="text-[10px] text-red-500 self-center"><i class="fas fa-trash-alt"></i></button>` : ''}
                    </div>`;
                });
                flow.scrollTop = flow.scrollHeight;
            });
        };

        // FUNCIONES DE GESTIÓN DE GRUPO
        window.openGroupSettings = () => {
            if(!currentRoom) return;
            document.getElementById('edit-g-name').value = currentRoom.name;
            const list = document.getElementById('group-members-list');
            list.innerHTML = "";
            currentRoom.members.forEach(m => {
                list.innerHTML += `<div class="flex items-center justify-between bg-slate-900/50 p-2 rounded-xl px-4 border border-slate-800">
                    <span class="text-xs text-slate-400">${m}</span>
                    ${m !== user.email ? `<button onclick="window.removeMember('${m}')" class="text-red-500"><i class="fas fa-user-minus"></i></button>` : ''}
                </div>`;
            });
            window.openModal('m-manage-group');
        };

        window.updateGroupName = async () => {
            const n = document.getElementById('edit-g-name').value;
            if(n) await updateDoc(doc(db, "salas", activeRoom), { name: n });
        };

        window.addMember = async () => {
            const e = document.getElementById('add-m-email').value.toLowerCase().trim();
            if(e) await updateDoc(doc(db, "salas", activeRoom), { members: arrayUnion(e) });
            document.getElementById('add-m-email').value = "";
            window.openGroupSettings();
        };

        window.removeMember = async (e) => {
            await updateDoc(doc(db, "salas", activeRoom), { members: arrayRemove(e) });
            window.openGroupSettings();
        };

        window.send = async () => {
            const i = document.getElementById('m-input');
            if(!i.value.trim() || !activeRoom) return;
            const uSnap = await getDoc(doc(db, "users", user.uid));
            if(uSnap.data().mute && uSnap.data().mute > Date.now()) {
                document.getElementById('mute-notice').classList.remove('hidden');
                setTimeout(()=>document.getElementById('mute-notice').classList.add('hidden'), 2000);
                return;
            }
            await addDoc(collection(db, "salas", activeRoom, "mensajes"), { uid: user.uid, user: user.name, pfp: user.pfp, text: i.value, time: serverTimestamp() });
            i.value = "";
        };

        window.updateStatus = async (val) => {
            await updateDoc(doc(db, "users", user.uid), { status: val });
            window.updateStatusUI(val);
        };

        window.updateStatusUI = (val) => {
            const dot = document.getElementById('u-status-dot');
            const colors = { Disponible: 'bg-emerald-500', Ocupado: 'bg-red-500', Ausente: 'bg-amber-500', Invisible: 'bg-slate-500' };
            document.getElementById('u-status-text').innerText = val;
            dot.className = `w-2 h-2 rounded-full ${colors[val]}`;
        };

        window.setAnnouncement = async () => {
            if(isAdmin) await setDoc(doc(db, "config", "announcement"), { text: document.getElementById('in-global-msg').value });
            document.getElementById('in-global-msg').value = "";
        };

        window.clearAnnouncement = async () => { if(isAdmin) await setDoc(doc(db, "config", "announcement"), { text: "" }); };

        function listenAnnouncements() {
            onSnapshot(doc(db, "config", "announcement"), (snap) => {
                const b = document.getElementById('global-announcement');
                if(snap.exists() && snap.data().text) {
                    document.getElementById('announcement-text').innerText = "📢 " + snap.data().text;
                    b.style.display = 'block';
                } else b.style.display = 'none';
            });
        }

        function initAdminPanel() {
            onSnapshot(collection(db, "users"), (snap) => {
                const list = document.getElementById('admin-user-list'); list.innerHTML = "";
                snap.forEach(d => {
                    const u = d.data(); if(u.email === MASTER_EMAIL) return;
                    list.innerHTML += `<div class="p-4 bg-slate-800/30 rounded-2xl border border-slate-800 flex flex-col gap-2">
                        <span class="text-xs font-bold text-indigo-400">${u.email}</span>
                        <div class="flex gap-2">
                            <button onclick="window.adminAction('${d.id}', 'ban')" class="flex-1 py-1 bg-red-500/20 text-red-500 text-[10px] rounded-lg">BAN</button>
                            <button onclick="window.adminAction('${d.id}', 'mute')" class="flex-1 py-1 bg-amber-500/20 text-amber-500 text-[10px] rounded-lg">MUTE</button>
                        </div>
                    </div>`;
                });
            });
        }

        window.adminAction = async (uid, type) => {
            const mins = prompt("Minutos (0 quita):", "60");
            if(mins) await updateDoc(doc(db, "users", uid), { [type]: parseInt(mins) === 0 ? false : Date.now() + (parseInt(mins)*60000) });
        };

        window.createGroup = async () => {
            const n = document.getElementById('in-g-name').value; if(!n) return;
            const id = "group_" + Date.now();
            await setDoc(doc(db, "salas", id), { id, name: n, type: 'group', owner: user.email, members: [user.email], icon: `https://ui-avatars.com/api/?background=6366f1&color=fff&name=${n}` });
            window.closeModal('m-group'); window.join(id);
        };

        window.addFriend = async () => {
            const e = document.getElementById('in-d-email').value.toLowerCase().trim(); if(!e) return;
            const id = [user.email, e].sort().join("_").replace(/[@.]/g, "");
            await setDoc(doc(db, "salas", id), { id, type: 'dm', members: [user.email, e] }, { merge: true });
            window.closeModal('m-dm'); window.join(id);
        };

        window.deleteMsg = async (mid) => { if(confirm("¿Eliminar?")) await deleteDoc(doc(db, "salas", activeRoom, "mensajes", mid)); };
        window.openUserProfile = () => { document.getElementById('u-pfp-large').src = user.pfp; document.getElementById('u-name-large').innerText = user.name; window.openModal('m-user-settings'); };
        window.openModal = (id) => document.getElementById(id).classList.add('active');
        window.closeModal = (id) => document.getElementById(id).classList.remove('active');
        window.goHome = () => { activeRoom = ''; document.getElementById('home-screen').classList.remove('hidden'); };
    </script>
</body>
</html>
